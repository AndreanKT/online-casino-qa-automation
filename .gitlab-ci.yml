image: python:3.12

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

run-api-tests:
  stage: test
  script:
    - pytest tests/api/ -v --tb=short --junitxml=reports/junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit.xml
    paths:
      - reports/report.html
      - reports/screenshots/
  only:
    - main
    - develop

run-ui-tests:
  stage: test
  script:
    - playwright install chromium
    - playwright install-deps chromium
    - pytest tests/ui/ -v --tb=short --junitxml=reports/junit.xml || echo "No UI tests or failures"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit.xml
    paths:
      - reports/report.html
      - reports/screenshots/
      - reports/videos/
  only:
    - main
    - develop