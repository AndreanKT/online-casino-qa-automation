stages:
  - test

run-api-tests:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - playwright install chromium
    - playwright install-deps chromium
    - pytest tests/api/ -v --tb=short
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/report.html
      - reports/screenshots/
  only:
    - main
    - develop

run-ui-tests:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - playwright install chromium
    - playwright install-deps chromium
    - pytest tests/ui/ -v --tb=short
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - junit: reports/junit.xml
      - reports/report.html
      - reports/screenshots/
      - reports/videos/
  only:
    - main
    - develop